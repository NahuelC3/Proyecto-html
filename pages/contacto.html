<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario para comunicarte con Nahuel Carbajal, estudiante de desarrollo web, sobre proyectos, propuestas de colaboración o cualquier consulta.">
    <meta name="keywords" content="contacto Nahuel Carbajal, formulario de contacto, colaboración en desarrollo web, consultas frontend">
    <meta name="author" content="Nahuel Carbajal">
    <title>Contacto | Nahuel Carbajal, estudiante de desarrollo web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <noscript>
        <style>
            [data-aos] {
                opacity: 1 !important;
                transform: none !important;
            }
        </style>
    </noscript>
</head>
<body class="body-site">

    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid max-width-container">
                <a class="navbar-brand" href="../index.html">
                    <img src="../images/logo.png" alt="Logotipo de Nahuel Carbajal" width="35" height="35" class="d-inline-block align-text-top">
                    Nahuel Carbajal
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="sobre-mi.html">Sobre mí</a></li>
                        <li class="nav-item"><a class="nav-link" href="proyectos.html">Proyectos</a></li>
                        <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contacto.html" aria-current="page">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <section class="section-card" data-aos="fade-up">
            <h1 class="main-title mb-3">Contacto</h1>
            <p class="text-p mb-4">Si querés ponerte en contacto conmigo para algún proyecto, propuesta de colaboración o consulta, podés completarme este formulario:</p>

            <form action="#" method="POST" class="needs-validation" data-aos="fade-up" data-aos-delay="100">
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Correo electrónico:</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="mb-3">
                    <label for="asunto" class="form-label fw-bold">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" class="form-control" placeholder="Consulta o propuesta" required>
                </div>

                <div class="mb-3">
                    <label for="mensaje" class="form-label fw-bold">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" class="form-control" placeholder="Escribí tu mensaje acá..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary px-4 py-2">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <footer class="footer-site">
        <p class="m-0">&copy; 2026 Nahuel Carbajal. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 600,
            easing: 'ease-out',
            once: true,
            offset: 80,
            disable: function () {
                return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            }
        });
    </script>
</body>
</html>
